<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>sohbetler</title>
<link rel="stylesheet" href="chats.css">
<link rel="stylesheet" href="mur47.css">
</head>
<body>
<header id="top">
  <span class="tag">sohbetler</span>
  <span id="count"></span>
  <span class="fill"></span>
  <span id="key">Ctrl+B</span>
  <button id="close" class="x" type="button" title="Sohbet listesini kapat"></button>
</header>
<label id="search"><span id="lens"></span><input id="q" type="text" placeholder="ara: başlık, istem, klasör" spellcheck="false" autocomplete="off"></label>
<div id="bulk" hidden>
  <span id="picked"></span>
  <span class="fill"></span>
  <button id="bulkArchive" type="button">arşivle</button>
  <button id="bulkClear" class="x" type="button" title="Seçimi temizle"></button>
</div>
<main id="list"></main>
<div id="grip"></div>
<script src="chats.js"></script>
</body>
</html>
